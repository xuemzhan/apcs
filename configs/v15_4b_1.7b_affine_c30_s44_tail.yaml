# v1.5: v15_4b_1.7b_affine_c30_s44_tail — P1-8 comparability fix
# inject_eval.seed=42 to guarantee identical eval set as s42 tail.
# seeds=[44] still controls prepare-data; inject_eval.seed controls the
# data-shuffle → eval-set identity.  Mapper calibration also uses seed=42
# (inseparable in current evaluator), so mapper ≈ s42; the point is
# eval-set comparability for the paper's 3-seed sentence.
experiment:
  name: v15-4b-to-1.7b-affine-c30-s44-tail
  run_id: ${experiment.name}-${run.timestamp}
provider:
  kv: hf
  score: synthetic
  timing: hf
teacher:
  model_id: Qwen/Qwen3-4b
  revision: main
  dtype: float16
  attention_implementation: sdpa
  device_map: cuda:0
  num_layers: 36
  num_kv_heads: 8
  head_dim: 128
student:
  model_id: Qwen/Qwen3-1.7b
  revision: main
  dtype: float16
  attention_implementation: sdpa
  device_map: cuda:0
  freeze: true
  num_layers: 28
  num_kv_heads: 8
  head_dim: 128
datasets:
  fidelity:
    - hellaswag
    - arc_challenge
  teacher_advantage:
    primary: mmlu
context_lengths: [512]
mapper:
  type: affine
  separate_kv: true
  de_rope: true
  de_rope_k: true
  de_rope_v: false
  ridge_lambda_k: 0.001
  ridge_lambda_v: 0.001
  rank: 16
  inject_eval_calib_samples: 30
  layer_selection: proportional
  inject_eval: true
  rope_align: rotated

inject_eval:
  max_samples: 300
  seed: 42
  calib_eval_split: true
  calib_samples: 30
  calib_shuffle: true
  persist_kv: false
  native_rescale: true
  summary_baseline: false
  probe_mode: false
  eval_from_tail_n: 100
  ablation_modes: [self_kv, native, kv_both]
seeds: [42]
output:
  base_dir: reports/runs
