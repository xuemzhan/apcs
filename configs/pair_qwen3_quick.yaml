experiment:
  name: qwen3-4b-to-1.7b
  run_id: ${experiment.name}-${run.timestamp}
  description: 'Same-family 主实验。Teacher Qwen3-4B, Student Qwen3-1.7B。

    验证 APCS 在 matched-KV 情形下的核心机制。

    '
teacher:
  model_id: Qwen/Qwen3-4B
  revision: main
  dtype: bfloat16
  attention_implementation: sdpa
  device_map: cuda:0
  num_layers: 36
  num_kv_heads: 8
  head_dim: 128
student:
  model_id: Qwen/Qwen3-1.7B
  revision: main
  dtype: bfloat16
  attention_implementation: sdpa
  device_map: cuda:0
  freeze: true
  num_layers: 28
  num_kv_heads: 8
  head_dim: 128
datasets:
  fidelity:
  - hellaswag
  - arc_challenge
  - winogrande
  teacher_advantage:
    primary: mmlu
    splits:
    - train
    - validation
    - test
  long_context:
  - ruler
  - longbench
  behavior_sensitive:
  - judge_set
  - ranker_set
context_lengths:
- 128
context_lengths_extended:
- 128
mapper:
  type: ridge
  rank: 4
  separate_kv: true
  de_rope: true
  de_rope_k: true
  de_rope_v: false
  ridge_lambda_k: 0.001
  ridge_lambda_v: 0.001
  source_top_k: 2
  layer_selection: proportional
  alpha_max: 0.5
  rms_calibration: true
  shared_basis: false
  t06_aggregate_samples: 2
  calibration_samples: 8
  replacement_calib_samples: 8
  replacement_eval_samples: 4
  t04_eval_samples: 4
  t06_context: 128
  calibration_context: 128
  t06_ranks:
  - 4
  - 8
advantage:
  rank: 2
  key: lowrank
  value: lowrank
  source_mixer: true
  rms_calibration: true
  bounded_alpha: true
query_gate:
  enabled: false
loss:
  lambda_task: 1.0
  lambda_self: 0.1
  lambda_teacher: 0.1
  lambda_att: 1.0
  lambda_reg: 0.01
  teacher_weight_from: train_split_margin
seeds:
- 0
- 1
- 2
statistics:
  bootstrap_n: 200
  ci: 0.95
  paired_test: permutation
timing:
  warmup: 1
  repeats: 2
  sync_cuda: false
  report:
  - p50
cache_residency: cpu
kv_save_full_debug:
  max_samples: 10
output:
  base_dir: reports/runs
  files:
  - config.yaml
  - metrics.json
  - system.json
  - geometry.json
  - stdout.log
  - summary.md
gates:
  retention_min: 0.9
  retention_strong: 0.95
  chg_positive: true
  psr_a_positive: true
t09_n_samples: 4
kinds:
- K
