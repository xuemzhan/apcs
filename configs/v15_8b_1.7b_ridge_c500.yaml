# 复现 arXiv 2608.03893 实验：Qwen3-8B → 1.7B，ridge per-head mapper，500 校准样本
# 2608.03893 使用 closed-form ridge mapper + de-RoPE + top-k source layers
experiment:
  name: v15-8b-to-1.7b-ridge-c500
  run_id: ${experiment.name}-${run.timestamp}

provider:
  kv: hf
  score: synthetic
  timing: hf

teacher:
  model_id: /workspace/.cache/modelscope/models/Qwen--Qwen3-8b/snapshots/master
  revision: main
  dtype: float16
  attention_implementation: sdpa
  device_map: cuda:0
  num_layers: 36
  num_kv_heads: 8
  head_dim: 128

student:
  model_id: /workspace/.cache/modelscope/models/Qwen--Qwen3-1.7b/snapshots/master
  revision: main
  dtype: float16
  attention_implementation: sdpa
  device_map: cuda:0
  freeze: true
  num_layers: 28
  num_kv_heads: 8
  head_dim: 128

datasets:
  fidelity:
    - hellaswag
    - arc_challenge
  teacher_advantage:
    primary: mmlu

context_lengths: [512]

mapper:
  type: ridge  # maps to RidgePerHeadMapper (per-head ridge, 2608.03893 core method)
  separate_kv: true
  de_rope: true
  de_rope_k: true
  de_rope_v: false
  ridge_lambda_k: 0.001
  ridge_lambda_v: 0.001
  inject_eval_calib_samples: 500  # 2608.03893 uses 500 calibration sequences
  layer_selection: proportional
  inject_eval: true
  rope_align: rotated

inject_eval:
  max_samples: 300
  seed: 42
  calib_eval_split: true
  calib_samples: 500  # 2608.03893: 500 FineWeb-Edu sequences of 1024 tokens
  calib_shuffle: true
  persist_kv: false
  native_rescale: true
  summary_baseline: false
  probe_mode: false
  eval_from_tail_n: 100
  ablation_modes: [self_kv, native, kv_both]

seeds: [42]
output:
  base_dir: reports/runs
