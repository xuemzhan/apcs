# v1.3 规模阶梯 C: mapper=affine calib=200 eval=100 task=true
experiment:
  name: v13-4b-to-1.7b-taskaware-c200
  run_id: ${experiment.name}-${run.timestamp}

provider:
  kv: hf
  score: synthetic
  timing: hf

teacher:
  model_id: Qwen/Qwen3-4b
  revision: main
  dtype: float16
  attention_implementation: sdpa
  device_map: cuda:0
  num_layers: 36
  num_kv_heads: 8
  head_dim: 128

student:
  model_id: Qwen/Qwen3-1.7b
  revision: main
  dtype: float16
  attention_implementation: sdpa
  device_map: cuda:0
  freeze: true
  num_layers: 28
  num_kv_heads: 8
  head_dim: 128

datasets:
  fidelity:
    - hellaswag
    - arc_challenge
  teacher_advantage:
    primary: mmlu

context_lengths: [512]

mapper:
  type: task_aware
  separate_kv: true
  de_rope: true
  de_rope_k: true
  de_rope_v: false
  ridge_lambda_k: 0.001
  ridge_lambda_v: 0.001
  inject_eval_calib_samples: 200
  layer_selection: proportional
  inject_eval: true
  rope_align: rotated
  task_loss_weight: 0.3
  task_delta_mode: diag
  learn_layer_alpha: true
  task_lr: 0.003
  task_steps: 60
  task_batch_size: 4

inject_eval:
  max_samples: 300
  seed: 42
  calib_eval_split: true
  calib_samples: 200
  calib_shuffle: true
  persist_kv: false
  native_rescale: true
  summary_baseline: true
  ablation_modes: [self_kv, native, kv_both]

seeds: [42]
output:
  base_dir: reports/runs
