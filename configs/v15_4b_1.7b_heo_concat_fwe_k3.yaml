context_lengths:
- 512
datasets:
  fidelity:
  - hellaswag
  - arc_challenge
  teacher_advantage:
    primary: mmlu
experiment:
  name: v15-4b-to-1.7b-heo-concat-fwe-k3-c100
  run_id: v15-4b-to-1.7b-heo-concat-fwe-k3-c100-${run.timestamp}
inject_eval:
  ablation_modes:
  - self_kv
  - kv_both
  calib_eval_split: true
  calib_samples: 100
  calib_shuffle: true
  eval_from_tail_n: 100
  max_samples: 300
  native_rescale: true
  persist_kv: false
  probe_mode: false
  seed: 42
  summary_baseline: false
  calib_corpus: fineweb_edu
  calib_corpus_tokens: 1024
  kv_cache_dtype: float16
mapper:
  de_rope: true
  de_rope_k: true
  de_rope_v: false
  inject_eval: true
  inject_eval_calib_samples: 100
  layer_selection: topk
  rank: 16
  ridge_lambda_k: 0.001
  ridge_lambda_v: 0.001
  rope_align: rotated
  separate_kv: true
  type: concat_ridge
  topk: 3
  topk_select_samples: 8
output:
  base_dir: reports/runs
provider:
  kv: hf
  score: synthetic
  timing: hf
seeds:
- 42
student:
  attention_implementation: sdpa
  device_map: cuda:0
  dtype: float16
  freeze: true
  head_dim: 128
  model_id: /workspace/models/Qwen3-1.7B
  num_kv_heads: 8
  num_layers: 28
  revision: main
teacher:
  attention_implementation: sdpa
  device_map: cuda:0
  dtype: float16
  head_dim: 128
  model_id: /workspace/models/Qwen3-4B
  num_kv_heads: 8
  num_layers: 36
  revision: main
