# =========================================================
# APCS 主模型对配置：Qwen3-4B (Teacher) → Qwen3-1.7B (Student)
# 对应 design.md §10 (G1: Same-Family Matched-KV)
# =========================================================

experiment:
  name: qwen3-4b-to-1.7b
  run_id: ${experiment.name}-${run.timestamp}
  description: |
    Same-family 主实验。Teacher Qwen3-4B, Student Qwen3-1.7B。
    验证 APCS 在 matched-KV 情形下的核心机制。

# ---- 模型 ----
teacher:
  model_id: Qwen/Qwen3-4B
  revision: main
  dtype: bfloat16
  attention_implementation: sdpa   # eager | sdpa | flash_attention_2
  device_map: cuda:0
  # 显式架构字段（_cfg_layers 不再依赖 model_id 字符串启发式）
  num_layers: 36
  num_kv_heads: 8          # GQA
  head_dim: 128

student:
  model_id: Qwen/Qwen3-1.7B
  revision: main
  dtype: bfloat16
  attention_implementation: sdpa
  device_map: cuda:0
  freeze: true                     # T08 强制：Student 全冻结
  # 显式架构字段（_cfg_layers 不再依赖 model_id 字符串启发式）
  num_layers: 28
  num_kv_heads: 8          # GQA
  head_dim: 128

# ---- 数据集分层 (design.md §14-§18) ----
datasets:
  fidelity:                         # T01 / T05 fidelity set
    - hellaswag
    - arc_challenge
    - winogrande
  teacher_advantage:                # T07/T09 teacher-advantage set
    primary: mmlu                   # 在 dataset-level 上选 teacher>student 的子集
    splits: [train, validation, test]
  long_context:                     # T10 scaling
    - ruler
    - longbench
  behavior_sensitive:               # T04/T09 behavior set
    - judge_set
    - ranker_set

# ---- 上下文长度 ----
context_lengths: [512, 1024, 2048, 4096]   # 资源有限先做 P0；后续加 8K/16K
context_lengths_extended: [8192, 16384]    # P1

# ---- Mapper (design.md §20) ----
mapper:
  type: ridge                       # ridge | lowrank | shared_basis
  rank: 16
  separate_kv: true                 # A8
  de_rope: true                     # 兼容旧配置，等价于 de_rope_k
  de_rope_k: true                   # RoPE 只作用于 Q/K
  de_rope_v: false                  # V 不做 RoPE
  ridge_lambda_k: 0.001
  ridge_lambda_v: 0.001
  source_top_k: 2                   # design.md §21, A7
  layer_selection: proportional     # A7: proportional | last-layer | data-driven | geometry-aware
  alpha_max: 0.5                    # design.md §25  bounded injection (validation freeze)
  rms_calibration: true             # A9
  shared_basis: false               # A2
  t06_aggregate_samples: 16         # §32 bug-3: ALS 类 mapper 拼接校准样本数上限（内存控制）

# ---- Advantage state (design.md §22) ----
advantage:
  rank: 16                          # A1
  key: lowrank                      # K/V separate
  value: lowrank
  source_mixer: true                # design.md §21
  rms_calibration: true
  bounded_alpha: true               # A10

# ---- Query gate (design.md §26) ----
query_gate:
  enabled: false                    # 默认关闭；A11

# ---- Loss (design.md §27) ----
loss:
  lambda_task: 1.0
  lambda_self: 0.1
  lambda_teacher: 0.1
  lambda_att: 1.0                   # 优先于 raw KV MSE
  lambda_reg: 0.01
  teacher_weight_from: train_split_margin

# ---- 统计与种子 (design.md §51) ----
seeds: [0, 1, 2]
statistics:
  bootstrap_n: 10000
  ci: 0.95
  paired_test: permutation

# ---- 系统计时 (design.md §49) ----
timing:
  warmup: 2
  repeats: 10
  sync_cuda: true
  report: [p50, p95]

# ---- Cache residency (design.md §50) ----
cache_residency: cpu                # R0: gpu / R1: cpu / R2: nvme
kv_save_full_debug:
  max_samples: 10                   # design.md §54

# ---- Run 数据规范 (design.md §63-§65) ----
output:
  base_dir: reports/runs
  files:
    - config.yaml
    - metrics.json
    - system.json
    - geometry.json
    - stdout.log
    - summary.md

# ---- 统计与门控 ----
gates:
  retention_min: 0.90               # Gate 1
  retention_strong: 0.95
  chg_positive: true                # Gate 2A
  psr_a_positive: true              # Gate 2A
