# =========================================================
# APCS 本地 GPU 配置：Qwen3-4B (Teacher) → Qwen3-1.7B (Student)
# 使用本地 ModelScope 缓存的模型
# =========================================================

experiment:
  name: qwen3-4b-to-1.7b-local
  run_id: ${experiment.name}-${run.timestamp}
  description: |
    Same-family 主实验（本地 GPU 路径）。Teacher Qwen3-4B, Student Qwen3-1.7B。
    模型从 ModelScope 本地缓存加载，GPU 走 CUDA 真实计算。

# ---- Provider 选择 ----
provider:
  kv: hf                      # T01 / T05 fidelity KV 源：HFKVProvider
  score: synthetic            # T09 得分源：合成可复现
  timing: hf                  # T10 系统计时源：真实 CUDA 计时

# ---- 模型 ----
teacher:
  model_id: Qwen/Qwen3-4B
  revision: main
  dtype: bfloat16
  attention_implementation: sdpa
  device_map: cuda:0
  num_layers: 36
  num_kv_heads: 8
  head_dim: 128

student:
  model_id: Qwen/Qwen3-1.7B
  revision: main
  dtype: bfloat16
  attention_implementation: sdpa
  device_map: cuda:0
  freeze: true
  num_layers: 28
  num_kv_heads: 8
  head_dim: 128

# ---- 数据集分层 ----
datasets:
  fidelity:
    - hellaswag
    - arc_challenge
    - winogrande
  teacher_advantage:
    primary: mmlu
    splits: [train, validation, test]
  long_context:
    - ruler
    - longbench
  behavior_sensitive:
    - judge_set
    - ranker_set

# ---- 上下文长度 ----
context_lengths: [512, 1024]
context_lengths_extended: [8192, 16384]

# ---- Mapper ----
mapper:
  type: ridge
  rank: 16
  separate_kv: true
  de_rope: true
  de_rope_k: true
  de_rope_v: false
  ridge_lambda_k: 0.001
  ridge_lambda_v: 0.001
  real_calibration_samples: 16
  real_eval_samples: 16
  source_top_k: 2
  layer_selection: proportional
  alpha_max: 0.5
  rms_calibration: true
  shared_basis: false
  t06_aggregate_samples: 8

dataset_prepare:
  samples_per_split: 128
  seed: 0

# ---- Advantage state ----
advantage:
  rank: 16
  key: lowrank
  value: lowrank
  source_mixer: true
  rms_calibration: true
  bounded_alpha: true

# ---- Query gate ----
query_gate:
  enabled: false

# ---- Loss ----
loss:
  lambda_task: 1.0
  lambda_self: 0.1
  lambda_teacher: 0.1
  lambda_att: 1.0
  lambda_reg: 0.01
  teacher_weight_from: train_split_margin

# ---- 统计与种子 ----
seeds: [0]
statistics:
  bootstrap_n: 100
  ci: 0.95
  paired_test: permutation

# ---- 系统计时 ----
timing:
  warmup: 1
  repeats: 3
  sync_cuda: true
  report: [p50, p95]

# ---- Cache residency ----
cache_residency: cpu
kv_save_full_debug:
  max_samples: 5

# ---- Run 数据规范 ----
output:
  base_dir: reports/runs
  files:
    - config.yaml
    - metrics.json
    - system.json
    - geometry.json
    - stdout.log
    - summary.md

# ---- 统计与门控 ----
gates:
  retention_min: 0.90
  retention_strong: 0.95
  chg_positive: true
